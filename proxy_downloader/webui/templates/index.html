<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proxy Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>📥 Proxy Downloader</h1>
    <p class="subtitle">Rotación de proxies · resume · batch · carpetas</p>
  </header>

  <main>
    <section class="card" id="new-job-card">
      <h2>Nueva descarga</h2>
      <form id="job-form">
        <div class="tabs">
          <button type="button" class="tab active" data-kind="auto">Archivo / Carpeta</button>
          <button type="button" class="tab" data-kind="batch">Batch</button>
        </div>

        <div class="field" id="field-single">
          <label for="value-single">URL o ID — se detecta solo si es archivo o carpeta</label>
          <input type="text" id="value-single" placeholder="https://pixeldrain.com/u/XXXXXXX (o /l/XXXXXXX para una carpeta)">
        </div>

        <div class="field hidden" id="field-batch">
          <label for="value-batch">Una URL/ID por línea (soporta líneas <code>folder: nombre</code>)</label>
          <textarea id="value-batch" rows="8" placeholder="folder: fotos de perritos
https://pixeldrain.com/u/XXXXXXX
https://www.mediafire.com/file/XXXXXXX/nombre/file

folder:
https://1fichier.com/?XXXXXXXXX"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="output-dir">Carpeta de salida</label>
            <input type="text" id="output-dir" placeholder="{{ default_output_dir }}">
          </div>
          <div class="field">
            <label for="proxy-mode">Proxy</label>
            <select id="proxy-mode">
              <option value="auto">Auto (según el sitio)</option>
              <option value="proxy">Forzar proxy</option>
              <option value="no-proxy">Sin proxy</option>
            </select>
          </div>
          <div class="field">
            <label for="min-speed">Velocidad mínima (KB/s)</label>
            <input type="number" id="min-speed" placeholder="1500">
            <span class="field-hint">Solo aplica con proxy: si un proxy baja de esto, rota a otro</span>
          </div>
        </div>

        <button type="submit" class="btn primary">Descargar</button>
        <span id="form-error" class="error-msg"></span>
      </form>
    </section>

    <section class="card" id="sites-card">
      <h2>Sitios <button type="button" class="btn small" id="toggle-sites">mostrar/ocultar</button></h2>
      <div id="sites-list" class="hidden"></div>
    </section>

    <section class="card" id="files-card">
      <h2>Archivos
        <button type="button" class="btn small" id="toggle-files">mostrar/ocultar</button>
        <button type="button" class="btn small hidden" id="refresh-files">↻ actualizar</button>
      </h2>
      <div id="files-panel" class="hidden">
        <div id="files-breadcrumb" class="breadcrumb"></div>
        <div id="files-list"></div>
      </div>
    </section>

    <section class="card" id="uploads-card">
      <h2>Subir archivos
        <button type="button" class="btn small" id="toggle-uploads">mostrar/ocultar</button>
      </h2>
      <div id="uploads-panel" class="hidden">
        <div class="tabs" id="upload-site-tabs"></div>

        <div id="upload-account-block">
          <div class="field-row">
            <div class="field hidden" id="upload-account-configured">
              <label>Cuenta</label>
              <div class="account-row">
                <span class="dim" id="upload-account-label"></span>
                <button type="button" class="btn small danger" id="upload-account-remove">Quitar</button>
              </div>
            </div>
            <div class="field" id="upload-account-form">
              <label for="upload-token">Token de cuenta</label>
              <input type="password" id="upload-token" placeholder="pegá tu token">
              <span class="field-hint" id="upload-token-hint"></span>
            </div>
            <div class="field" id="upload-account-save-field">
              <label>&nbsp;</label>
              <button type="button" class="btn" id="upload-account-save">Guardar y verificar</button>
            </div>
          </div>
          <span class="error-msg" id="upload-account-error"></span>
        </div>

        <div class="field-row hidden" id="upload-folder-row">
          <div class="field">
            <label for="upload-folder">Carpeta / álbum destino</label>
            <select id="upload-folder"></select>
          </div>
          <div class="field">
            <label for="upload-new-folder">Crear nueva</label>
            <div class="inline-form">
              <input type="text" id="upload-new-folder" placeholder="nombre">
              <button type="button" class="btn small" id="upload-create-folder">Crear</button>
            </div>
          </div>
        </div>

        <div class="field" id="upload-source-block">
          <label for="upload-file-input">Archivo(s) desde este dispositivo</label>
          <input type="file" id="upload-file-input" multiple>
          <div id="upload-selected-existing" class="hidden field-hint"></div>
        </div>

        <button type="button" class="btn primary" id="upload-submit">Subir</button>
        <span class="error-msg" id="upload-form-error"></span>

        <div class="uploads-jobs-head">
          <h3>Subidas</h3>
          <button type="button" class="btn small" id="upload-clear-finished">limpiar completados</button>
        </div>
        <div id="upload-jobs-list"><p class="dim">Sin subidas todavía.</p></div>
      </div>
    </section>

    <section class="card">
      <h2>Trabajos
        <button type="button" class="btn small" id="clear-finished">limpiar completados</button>
      </h2>
      <div id="jobs-list"><p class="dim">Sin trabajos todavía.</p></div>
    </section>
  </main>

  <div id="preview-modal" class="preview-modal hidden">
    <div class="preview-modal-inner">
      <button type="button" class="preview-close" id="preview-close">✕</button>
      <div id="preview-content"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
