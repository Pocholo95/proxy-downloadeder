; Runs both apps as PID 1's children in the combined image: proxy-downloader
; (gunicorn) and VidGrid (its stdlib-only Python dev server) side by side.
; Docker containers want a single foreground process — this is that process,
; and it forwards both apps' logs to the container's own stdout/stderr so
; `docker logs` still shows everything.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:proxy-downloader]
command=gunicorn --bind 0.0.0.0:8080 --workers 1 --threads 8 proxy_downloader.webui.app:app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vidgrid]
command=python3 -m desktop.app
directory=/app/vidgrid
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
