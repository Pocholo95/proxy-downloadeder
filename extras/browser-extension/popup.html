<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Proxy Downloader</title>
<style>
  * { box-sizing: border-box; }
  body {
    width: 340px; margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #17181c; color: #e8e8ea; font-size: 12.5px;
  }
  header {
    padding: 10px 12px; font-weight: 600; font-size: 13px;
    border-bottom: 1px solid #2a2b30;
  }
  #list { max-height: 320px; overflow-y: auto; }
  .empty { padding: 22px 12px; color: #8a8b91; text-align: center; line-height: 1.5; }
  .item {
    padding: 8px 12px; border-bottom: 1px solid #23242a;
    display: flex; align-items: center; gap: 8px;
  }
  .item .name {
    flex: 1; min-width: 0; font-size: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item .meta { font-size: 10.5px; color: #8a8b91; margin-top: 2px; }
  button {
    cursor: pointer; border: none; border-radius: 5px; font-size: 11.5px;
    padding: 5px 10px; font-weight: 600; font-family: inherit; flex-shrink: 0;
  }
  .send-btn { background: #1f6feb; color: #fff; }
  .send-btn:disabled { opacity: 0.55; cursor: default; }
  #status { padding: 0 12px 8px; min-height: 14px; }
  #status.error { color: #f97066; }
  #status.ok { color: #3fb950; }
  #settings {
    padding: 10px 12px; border-top: 1px solid #2a2b30;
    display: flex; flex-direction: column; gap: 6px;
  }
  #settings label { font-size: 10.5px; color: #8a8b91; }
  #settings .row { display: flex; gap: 6px; }
  #settings input {
    flex: 1; min-width: 0; background: #202126; border: 1px solid #2a2b30;
    border-radius: 5px; color: #e8e8ea; padding: 6px 8px; font-size: 12px; font-family: inherit;
  }
  #save-server { background: #2a2b30; color: #e8e8ea; }
</style>
</head>
<body>
  <header>Videos detectados en esta pestaña</header>
  <div id="list"><div class="empty">Buscando…</div></div>
  <div id="status"></div>
  <div id="settings">
    <label for="server-input">Servidor Proxy Downloader</label>
    <div class="row">
      <input type="text" id="server-input" placeholder="http://100.x.x.x:8080">
      <button id="save-server">Guardar</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
